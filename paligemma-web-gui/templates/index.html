<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaliGemma Image Question Answering</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .image-preview {
            max-width: 500px;
            max-height: 500px;
            margin: 20px 0;
        }
        #loading {
            display: none;
        }
        .container {
            max-width: 800px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center mb-4">PaliGemma Image Question Answering</h1>
        
        <div class="mb-3">
            <label for="imageInput" class="form-label">Upload Image</label>
            <input type="file" class="form-control" id="imageInput" accept="image/*">
        </div>

        <div class="text-center">
            <img id="preview" class="image-preview" style="display: none;">
        </div>

        <div class="mb-3">
            <label for="question" class="form-label">Ask a question about the image</label>
            <input type="text" class="form-control" id="question" placeholder="What do you see in this image?">
        </div>

        <button onclick="processImage()" class="btn btn-primary mb-3" id="submitBtn">Submit</button>
        
        <div id="loading" class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <p>Processing your request...</p>
        </div>

        <div class="mb-3">
            <label for="response" class="form-label">Response</label>
            <textarea class="form-control" id="response" rows="3" readonly></textarea>
        </div>
    </div>

    <script>
        let imageData = null;

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imageData = e.target.result;
                    document.getElementById('preview').src = imageData;
                    document.getElementById('preview').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        });

        async function processImage() {
            if (!imageData) {
                alert('Please upload an image first');
                return;
            }

            const question = document.getElementById('question').value;
            if (!question) {
                alert('Please enter a question');
                return;
            }

            // Show loading spinner
            document.getElementById('loading').style.display = 'block';
            document.getElementById('submitBtn').disabled = true;
            document.getElementById('response').value = '';

            try {
                const response = await fetch('/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: imageData,
                        question: question
                    })
                });

                const data = await response.json();
                if (data.error) {
                    throw new Error(data.error);
                }
                document.getElementById('response').value = data.response;
            } catch (error) {
                alert('Error: ' + error.message);
                document.getElementById('response').value = 'Error processing request';
            } finally {
                // Hide loading spinner
                document.getElementById('loading').style.display = 'none';
                document.getElementById('submitBtn').disabled = false;
            }
        }
    </script>
</body>
</html>
